name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    # A hung Finder script would otherwise hold a macOS runner for the 6 hour default.
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs because tags can be moved; the comment is the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist

      - name: Test, build, verify and package
        run: ./build.sh --dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StatusCollapse-dmgs
          path: build/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # Shown above the generated changelog. The app isn't notarized (that needs a paid Apple
          # Developer account), so macOS blocks its first launch until it's allowed.
          NOTES: |
            Requires macOS 27 or later, on a Mac with Apple silicon.

            ## First launch

            StatusCollapse isn't notarized by Apple, so macOS blocks it the first time you open it:

            1. Drag StatusCollapse to Applications and open it. When macOS says it can't verify the app, click **Done**.
            2. Open **System Settings › Privacy & Security** and click **Open Anyway** next to the message about StatusCollapse.
            3. Confirm with **Open Anyway** and your password. This is only needed once.
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "$GITHUB_REF_NAME" --generate-notes --notes "$NOTES"
